name: release
on:
  schedule:
    # Off the hour: GitHub delays and drops runs scheduled at :00.
    - cron: "44 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install
      - run: npm run all
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Bumps the version, tags, pushes, and publishes with npm Trusted Publishing
      # (OIDC, no token). Does nothing if shipped files are unchanged. See .github/README.md.
      - run: node scripts/stamp.ts --if-changed
